<body>
  <div id="__bundler_thumbnail"><svg sc-camel-view-box="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="800" fill="#1E1C1B"></rect><rect x="440" y="240" width="320" height="320" rx="72" fill="#D9523F"></rect><path d="M520 480V320h36l88 108V320h36v160h-36l-88-108v108z" fill="#F9F4ED"></path></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"适用于建议、合作，或应用无法打开的情况。主题请写明问题类型，便于更快处理。\", path: \"主题示例：问题：4K HEVC 播放掉帧（macOS 15.2 / M2）\" },\n      ],\n      before: [\n        { n: \"1\", t: \"系统与版本\", d: \"macOS 版本、机型与芯片、Nsurator 版本号。\", where: \"设置 › 关于 · 第一行\" },\n        { n: \"2\", t: \"复现步骤\", d: \"简要的操作步骤，或一段 15 秒左右的录屏。\", where: \"⌘⇧5 录屏 · 随邮件附件发送\" },\n        { n: \"3\", t: \"播放问题：诊断信息\", d: \"容器、编码、音轨、解码方式与出现问题的时间点，可在诊断面板中一键复制。\", where: \"播放中 ⌘⌥D › 复制\" },\n      ],\n      lookups: [\n        { ...nav(\"首次设置：四步开始使用\", \"guide\"), where: \"使用说明\" },\n        { ...nav(\"播放卡顿、无声音、4K 掉帧的排查方法\", \"guide\"), where: \"使用说明\" },\n        { ...nav(\"文件是否会被上传\", \"privacy\"), where: \"隐私政策\" },\n        { ...nav(\"免费版限制、Pro 与退款\", \"terms\"), where: \"使用条款\" },\n      ],\n      guide: [\n        { title: \"快速上手\", blocks: [P(\"首次打开时的引导即为以下四步，这里是详细说明。\"), O([\n          [\"指一个地方放影片\", \"媒体库位置可以是本机文件夹、外置硬盘，或已挂载的网盘。Nsurator 不搬走你现有的目录结构——它记住路径，按你设定的规则整理。外置盘拔掉也不会丢数据，资料和标签都还在。\", \"设置 › 整理媒体库 › 媒体库位置\"],\n          [\"把下载文件夹交给收件箱\", \"选一个要监听的文件夹，通常就是「下载」。新文件下载完成后出现在收件箱，分成三列：待归档、待确认、暂不可归档。\", \"设置 › 整理媒体库 › 监听文件夹\"],\n          [\"归档第一批\", \"在「待归档」列点「全部归档」，文件按人物、年份或系列进入清单。同名按你设定的规则处理，不会静默覆盖。首次使用建议先归档少量影片，确认规则符合预期。\", \"收件箱 › 全部归档\"],\n          [\"双击播放\", \"自研播放核心直接播三十余种容器，从 RMVB 到 HEVC、AV1；蓝光 BDMV、ISO 目录也能当一部影片打开；HEVC、AV1 与 4K 走硬件解码。免费版每月可播 15 次；整理、归档、识别、备份都不限次。\", \"任意影片 › 双击 / 空格\"]])] },\n        { title: \"收件箱\", blocks: [P(\"收件箱只看你指定的监听文件夹，其他目录一概不碰。新文件要等下载完成、大小稳定后才会出现，所以不会归进半个文件。\"), L([\"待归档：本机可以直接处理的，一键全部归档。\", \"待确认：识别出多个候选人物或年份，需要你点一下选哪个。\", \"暂不可归档：目标硬盘没接、文件正被别的程序占用。原因写在每一行，条件满足后自动回到「待归档」。\"]), P(\"同名文件不视为错误。在「同名处理」中设定一次规则：跳过、覆盖或添加序号；之后遇到同名文件按此规则处理，并在结果中列出。\")] },\n        { title: \"清单与合集\", blocks: [P(\"清单按媒体库分组，一部影片只属于一个清单，位置就是它在硬盘上的位置。合集是另一层：一部影片可以进任意多个合集，不动文件。\"), P(\"智能合集写一条规则，自己更新。规则由「人物 · 年份 · 分辨率 · 标签 · 看过 / 未看 · 加入时间」组合，比如「未看 · 2024 年后 · 4K」。规则改了，合集立即重算。\"), N(\"换硬盘、改目录结构，合集不受影响——它记的是影片本身，不是路径。\")] },\n        { title: \"播放与字幕\", blocks: [P(\"双击或空格开始播放。多音轨、多字幕在播放器右下角切换，记住每部影片上次的选择。\"), L([\"外挂字幕：与影片同名的 .srt / .ass / .sup 自动匹配；放在同目录任意位置的字幕，可以在详情面板「伴随文件」里手动添加。\", \"伴随文件跟着影片走：归档、移动、重命名时，字幕和 NFO 一起动。\", \"续播：从上次停下的地方继续；看到片尾自动标记为已看。\"]), P(\"免费版每月可播放 15 次，每月 1 日重新计数；Pro 不限次。计数只在本机，我们看不到。\")] },\n        { title: \"播放诊断\", blocks: [P(\"播放中按 ⌘⌥D 打开诊断面板。它显示容器、编码、音轨、当前解码方式、掉帧数和读取速率——出问题时先看这几项，通常就能判断是文件、硬盘还是 app 的事。\"), K([[\"掉帧持续上升\", \"多半是读取速率跟不上：外置盘、网盘、USB Hub 都常见。拷到本机播一次对比。\"], [\"没有声音\", \"看音轨编码：TrueHD / DTS-HD 部分机型只能转码输出，切另一条音轨试试。\"], [\"解码显示 software\", \"这个编码组合没走硬件解码，4K 会吃 CPU。HEVC 10-bit 与 AV1 在 M 系列芯片上都应显示 hardware。\"], [\"字幕不同步\", \"外挂字幕的时间轴问题，播放器里可以整体偏移；内封字幕不同步请报告。\"]]), P(\"面板中的「报告这个问题」会自动附上本次诊断信息；「复制」可将其放入剪贴板，用于邮件。\")] },\n        { title: \"识别人物\", blocks: [P(\"识别在你的 Mac 上完成：首次开启时下载一次模型文件，之后画面与特征向量均不离开设备。首次分析一部影片需要数十秒到数分钟，之后为增量分析。\"), L([\"参考照片：给一个人物加一两张正面照，识别会更稳；照片只存在本机资料库。\", \"合并与重命名：同一个人被分成两位时，拖一位到另一位上合并；改名对所有相关影片生效。\", \"关闭识别：设置里关掉后，app 停止分析新影片；删除某个人物时，对应的特征向量一并删除。\"])] },\n        { title: \"私密空间\", blocks: [P(\"把影片移入私密空间，它会同时从清单、搜索、合集和 Spotlight 索引中消失，需要 Touch ID 或系统密码才能看见。锁定时不保留可读的缩略图。\"), L([\"自动锁定：切到别的 app、屏幕休眠、或空闲一段时间后自动上锁，时间在设置里选。\", \"立即锁定：⌘⌥L。\", \"移出：解锁后在影片上右键「移出私密空间」，它回到原来的清单。\"]), N(\"解锁凭据由 macOS 钥匙串与本机生物识别管理，我们不持有也无法绕过。因此不存在「找回」流程：若失去对这台 Mac 的访问能力，私密空间中的资料将无法恢复。这是有意的设计取舍。\")] },\n        { title: \"AI 智能体\", blocks: [P(\"Pro 功能。开启后，Nsurator 在本机回环地址上提供 MCP 服务；Claude Code、Codex、Cursor、Windsurf、Gemini、Kimi 等客户端复制一行配置即可连接，用自然语言查询片库、创建合集、批量添加标签。\"), L([\"权限逐条开关：读片库、写标签、建合集、移动文件，各自独立；默认只开「读」。\", \"调用留痕：每次调用记录时间、来源与动作，在设置里可以查看和清空。\", \"只在本机：服务只接受这台 Mac 上的连接，不对局域网或公网开放。\"]), N(\"私密空间永远在 AI 智能体的可见范围之外，任何权限组合都读不到。\")] },\n        { title: \"备份与搬家\", blocks: [P(\"在「备份与搬家」里随时手动备份资料库到你指定的位置。备份里是资料——标签、人物、合集、观看记录——不含视频文件本身，所以很小。\"), O([\n          [\"换硬盘\", \"把影片拷到新盘，然后在「媒体库位置」指向新盘。Nsurator 按文件内容重新对上，标签和人物都跟过去。\", \"设置 › 整理媒体库 › 媒体库位置\"],\n          [\"用备份覆盖现在的资料\", \"先做一次预演，列出会改动什么；确认后写入。合并是全有或全无的：哪一步出错就整笔撤回，一行不写。\", \"设置 › 备份与搬家 › 用备份恢复\"]]),\n          P(\"合并时若有个别项无法写入（例如备份中某条记录损坏），Nsurator 会列出具体项目与原因，并提供「跳过这 N 项，继续合并」；其余内容照常合并，结果中会列出未合并的项目。磁盘空间不足、资料库被占用等原因无法跳过，需处理后重试。\")] },\n        { title: \"键盘快捷键\", blocks: [K([[\"空格\", \"播放 / 暂停\"], [\"← →\", \"后退 / 前进 10 秒\"], [\"⌘1 ⌘2 ⌘3\", \"影片 / 合集 / 收件箱\"], [\"⌘F\", \"搜索整个片库\"], [\"⌘⇧A\", \"把待归档的全部归档\"], [\"⌘⌥D\", \"打开播放诊断\"], [\"⌘⌥L\", \"立即锁定私密空间\"], [\"⌘⌫\", \"把选中影片移到废纸篓\"]]), P(\"完整列表见菜单栏「帮助 › 键盘快捷键」。\")] },\n      ],\n      privacy: [\n        { title: \"先说结论\", blocks: [L([\"影片文件永远留在你的设备上，本应用没有上传它们的能力。\", \"没有账号，不需要注册，因此没有任何东西能指向「你这个人」。\", \"不埋点、不做分析统计、不接第三方追踪 SDK。\", \"只有六类网络请求，全部列在第 04 条，且都由你的动作触发。\"]), P(\"以下为全文。摘要仅为便于阅读，如有出入以正文为准。\")] },\n        { title: \"这份政策管什么\", blocks: [P(\"本政策说明 Nsurator for macOS（下称「本应用」）如何处理与你有关的信息。本应用仅通过 Mac App Store 分发；其他渠道的同名程序与我们无关。\"), P(\"本应用没有账号系统，你不需要注册、不需要登录，我们也因此无法把任何数据和「你这个人」对应起来。\")] },\n        { title: \"留在你设备上的数据\", blocks: [P(\"本应用的全部工作数据都写在你的 Mac 上，默认位于应用沙盒的 Application Support 目录，媒体库位置由你指定。这些数据包括：\"), L([\"影片的文件路径、文件名、大小、时长、容器与编解码等技术信息；\", \"你自己写下的标签、笔记、评分、人物命名与合集规则；\", \"观看历史与播放进度；\", \"缩略图与预览帧缓存；\", \"人脸特征向量——由本机模型从你的影片画面中提取，用于把同一个人的镜头归到一起；\", \"私密空间的索引，以及本月播放次数等授权相关的本地计数。\"]), P(\"我们不持有这些数据的任何副本，也没有可以存放它们的服务器。你可以随时整份复制或删除。\"), N(\"影片文件本身永远不会被上传。本应用不具备把视频内容发送到任何远端的能力。\")] },\n        { title: \"本应用发出的全部网络请求\", blocks: [P(\"下表是本应用可能联网的全部情形。除此之外没有任何后台上报、遥测或心跳请求；断网状态下，除下列功能外一切正常可用。\"), T([\"做什么\", \"发往哪里\", \"包含什么\"], [\n          [\"内购与授权校验\", \"Apple（App Store / StoreKit）\", \"由 Apple 处理的交易凭据。我们只收到「已购买 / 未购买」这一个结果，看不到你的 Apple ID、姓名或支付信息。\"],\n          [\"影片资料补全\", \"TMDB（themoviedb.org）\", \"仅在你点击「补全元数据」时发出，内容是你要查询的片名或年份。不含文件路径、设备标识或任何账号信息。\"],\n          [\"报告问题\", \"Nsurator 自己的接口\", \"仅在你点「发送」时：你写的内容、可选的回信邮箱、勾选的诊断日志与你添加的截图。诊断日志里没有文件名、路径或人物姓名。\"],\n          [\"崩溃与卡顿报告\", \"Apple\", \"仅当你在「系统设置 › 隐私与安全性 › 分析与改进」里开启了与开发者共享。由 Apple 匿名化后转交，内容是堆栈与设备型号，不含文件名。\"],\n          [\"识别模型下载\", \"模型发布方的下载地址（AuraFace：fal.ai；YuNet：OpenCV Zoo）\", \"仅在你首次开启人物识别时发出一次，内容只是下载两个模型文件的请求，不含任何与你或你的影片有关的信息。此后识别全程在本机运行。\"],\n          [\"访问你添加的媒体源\", \"你自己指定的 SMB / SFTP / FTP / WebDAV 服务器或网盘（如 MEGA）\", \"读取目录与影片文件所需的请求，只发往你填写的那台服务器或你登录的服务商；登录凭据保存在本机，我们不经手、也看不到。\"]]), P(\"与任何网络请求一样，接收方能看到你的 IP 地址，上表不再逐条重复。如不需要联网的资料补全，不使用该功能即可；本应用不会自行发起请求。\")] },\n        { title: \"人物识别在本机完成\", blocks: [P(\"人脸检测与特征提取由本机模型执行——模型文件在你首次开启识别时下载一次，之后运算全部发生在你的 Mac 上。照片、画面截图和人脸特征向量都不会离开设备，也不会用于训练任何模型。\"), P(\"你可以在设置里关闭识别；关闭后本应用停止分析新影片。删除某个人物时，对应的特征向量一并删除。\")] },\n        { title: \"AI 智能体（MCP）\", blocks: [P(\"开启后，本应用在本机回环地址（127.0.0.1）上监听，只接受这台 Mac 上的客户端连接，不对局域网或公网开放。可授予的能力逐条开关，每次调用都会记录时间、来源与动作，日志可查看也可清空。\"), P(\"私密空间永远被排除在 AI 智能体的可见范围之外，任何权限组合都无法读到其中的内容。\"), N(\"你连接的 AI 客户端（例如 Claude Code、Codex、Cursor、Windsurf、Gemini、Kimi）是第三方产品。你在其中输入的内容、以及它把哪些信息发往哪家公司的服务器，由那家公司的隐私政策决定——本应用只负责回答它在本机提出的问题，无法约束其后续行为。接入前请先读一遍对方的隐私条款。\")] },\n        { title: \"私密空间\", blocks: [P(\"移入私密空间的影片会同时从清单、搜索、合集和 Spotlight 索引中消失，需要 Touch ID 或系统密码才能看见。锁定状态下不保留可读的缩略图缓存。\"), P(\"解锁凭据由 macOS 钥匙串与本机生物识别管理，我们既不持有也无法绕过。因此不存在「找回」流程：若你失去对这台 Mac 的访问能力，我们无法协助恢复。这是有意的设计取舍。\")] },\n        { title: \"我们不做的事\", blocks: [L([\"不出售、不出租、不交换任何与你有关的信息；\", \"不投放广告，不做用户画像，不做行为定向；\", \"不接入任何第三方分析或追踪 SDK——本应用中不存在 Google Analytics、Firebase、Facebook SDK 或第三方崩溃平台；\", \"不在后台扫描与本应用无关的目录；只读取你明确授权的媒体库位置和监听文件夹。\"])] },\n        { title: \"儿童\", blocks: [P(\"本应用不面向 14 岁以下（部分地区为 13 或 16 岁以下）的儿童，也不会有意收集他们的个人信息。由于本应用不设账号、不收集身份信息，实际上也不具备识别用户年龄的手段。\")] },\n        { title: \"你的权利，以及如何行使\", blocks: [P(\"因为数据在你自己的设备上，大部分权利你可以直接行使，不必等我们批准：\"), L([\"查阅与导出：资料库就是一个文件夹加一个数据库文件，整份拷走即可；设置里也提供导出。\", \"更正：标签、人物、笔记在界面里直接改。\", \"删除：删除资料库文件夹即清空全部记录；清除缓存不会动你的影片文件。\"]), P(\"对于我们确实持有的极少量信息——你通过「报告问题」或邮件发来的内容——你可以写信要求查阅或删除，我们会在 30 天内处理；报告内容在问题关闭 90 天后自动删除。若你位于中国内地、欧洲经济区、英国或加利福尼亚州，本政策同样适用当地法律赋予你的相应权利。\")] },\n        { title: \"政策变更\", blocks: [P(\"政策有实质变更时，我们会更新本页顶部的日期，并在应用内提示一次。历史版本可以写信索取。继续使用新版本即表示接受更新后的政策。\")] },\n        { title: \"联系\", blocks: [P(\"隐私相关问题请发送至 support@nsurator.com，工作日 48 小时内回复。\"), M(\"开发者   个人开发者，与 Mac App Store 页面「销售商」所示一致\\n邮箱     support@nsurator.com\")] },\n      ],\n      terms: [\n        { title: \"你和谁在订这份约\", blocks: [P(\"本条款是你与 Nsurator 开发者之间关于使用 Nsurator for macOS 的 c Domain\", \"资料库存储引擎，使用 macOS 自带的 libsqlite3，不另行打包。\"]])] },\n        { title: \"本机识别\", blocks: [P(\"识别在你的 Mac 上完成。运行时随 app 分发；两个模型文件在你首次开启识别时下载到本机，此后不再联网。\"), PK([[\"ONNX Runtime 1.23.2\", \"MIT\", \"Microsoft。在本机执行人脸检测与特征提取模型。\"], [\"AuraFace-v1（glintr100.onnx · af6d057）\", \"Apache-2.0\", \"fal.ai。人脸特征提取模型，首次使用时下载。\"], [\"YuNet（face_detection_yunet_2023mar.onnx）\", \"MIT\", \"OpenCV Zoo / Shiqi Yu。人脸检测模型，首次使用时下载。\"]])] },\n        { title: \"媒体源与网络\", blocks: [P(\"连接 SMB 共享、SFTP 与 MEGA 网盘所用的组件。FTP、WebDAV 与其他网盘走 macOS 自带的 libcurl，不另行打包。\"), PK([[\"SMBClient 0.3.1\", \"MIT\", \"kishikawakatsumi。SMB 共享访问。\"], [\"swift-nio 2.102.0 · swift-nio-ssh 0.15.0\", \"Apache-2.0\", \"网络事件循环与 SSH / SFTP 传输。\"], [\"swift-crypto 4.5.2\", \"Apache-2.0\", \"加密原语；内含 BoringSSL（ISC 与 OpenSSL 许可）。\"], [\"swift-asn1 1.7.2 · swift-atomics 1.3.1 · swift-collections 1.6.0 · swift-system 1.8.1\", \"Apache-2.0\", \"上述 Swift 包的基础依赖。\"], [\"MEGA SDK 10.18.0\", \"BSD-2-Clause\", \"Mega Limited。MEGA 网盘访问。\"], [\"MEGA SDK 静态链入：Crypto++ · libsodium · libcurl · SQLite · ICU · zlib · zstd\", \"BSL-1.0 · ISC · curl · Public Domain · Unicode-ICU · zlib · BSD-3-Clause\", \"版本由 vcpkg 锁定，仅供 MEGA SDK 内部使用。\"]])] },\n        { title: \"AI 智能体\", blocks: [P(\"MCP 回环服务 NsuratorAgentProtocol 为自研实现，不使用第三方 MCP SDK 或日志库；其网络层依赖即上文的 swift-nio 与 swift-crypto。\")] },\n        { title: \"界面\", blocks: [P(\"界面图标使用 Apple 的 SF Symbols（系统资源，非开源，不在此列）；app 不打包任何第三方字体。\"), PK([[\"Simple Icons\", \"CC0-1.0\", \"仅用于 AI 智能体设置里 Claude、Codex（OpenAI 标志）、Cursor、Windsurf、Gemini、Kimi 六个客户端的小图标。\"], [\"Lucide\", \"ISC\", \"首启引导中的一枚对勾图形按其 24 格网格描绘。\"]])] },\n        { title: \"本站使用的字体（非 app 依赖）\", blocks: [PK([[\"Figtree\", \"SIL OFL 1.1\", \"官网正文字体。\"], [\"Caprasimo\", \"SIL OFL 1.1\", \"官网标题字体。\"]])] },\n        { title: \"LGPL 组件的源码获取\", blocks: [P(\"FFmpeg、libbluray、libudfread 与 FriBidi 以 LGPL 2.1 或更新版本许可使用，源码均未修改。附带的 ffmpeg / ffprobe 是独立程序，可以直接用同版本的自编译二进制替换；进程内播放核心中的 FFmpeg、libbluray、libudfread 为静态链接，我们按 LGPL 第 6 条提供重新链接所需的材料。\"), P(\"如需构建时使用的确切源码、配置行与编译脚本，以及用于重新链接的目标文件，请发送邮件至 support@nsurator.com 并注明应用版本号，我们会提供对应的归档或公开仓库地址。\"), M(`$ ffmpeg -version            # app 附带的命令行版本\\nffmpeg version 8.1.2 … libavutil license: LGPL version 2.1 or later\\n\\n# 版本与源码归档\\n${version} · nsurator-${version}-oss.tar.gz`)] },\n        { title: \"没有用到的东西\", blocks: [P(\"为免误会，在此说明：本应用不包含任何分析或追踪 SDK，不包含广告组件，也不包含 App Store 之外的自更新框架，更新一律通过 Mac App Store 分发；播放组件不含 x264 / x265 等 GPL 编码器，H.264 编码走系统 VideoToolbox。\")] },\n        { title: \"致谢与纠错\", blocks: [P(\"如果你是上述任一项目的维护者，发现署名、许可证或用途描述有误，请发送邮件至 support@nsurator.com，我们会在下一个版本更正。\")] },\n      ],\n      foot: { guide: [\"未涵盖的内容欢迎来信询问。使用说明会随版本更新。\", \"support@nsurator.com\"], privacy: [\"如有任何一条表述不清，欢迎来信指出，我们会修订。\", \"support@nsurator.com\"], terms: [\"如对条款中的任何一条有疑问，欢迎来信。\", \"support@nsurator.com\"], oss: [\"如清单有遗漏或署名有误，欢迎来信，我们会在下一版本更正。\", \"support@nsurator.com\"] },\n    };\n\n    const EN = {\n      t: { navFeatures: \"Features\", navPlay: \"Playback\", navFormats: \"Formats\", navLog: \"Updates\", navFaq: \"FAQ\", navProduct: \"Product\", navSupport: \"Support\", navCta: \"Download\", tocH: \"On this page\", rec: \"Recommended\", beforeH: \"When emailing, please include\", diagNote: \"Diagnostics contain only the system, the version and the technical parameters of that playback — no file names, paths or people's names. Please do not attach video files to email; if a sample is needed, we will explain how to send it.\", appleH: \"Subscriptions, refunds and invoices\", appleP: \"Nsurator is sold only on the Mac App Store; purchases, renewals, cancellations and invoices are all handled by Apple. We cannot see your Apple account and cannot issue refunds ourselves — submitting a request to Apple directly is faster. If you run into trouble with the request, write to us and we will help explain the situation.\", appleBtn: \"Request a refund from Apple\", appleManage: \"Manage subscriptions: App Store › Account › Subscriptions\", lookH: \"Answers that may already exist\", brandLine: \"A film library that lives on your own drive.\", footNote: \"Available only on the Mac App Store\" },\n      groups: [[\"Support\", [[\"support\", \"Contact support\"], [\"guide\", \"User guide\"]]], [\"Legal\", [[\"privacy\", \"Privacy Policy\"], [\"terms\", \"Terms of Use\"], [\"oss\", \"Open source\"]]]],\n      fcols: [[\"Product\", [site(\"Features\", \"#features\"), site(\"Formats\", \"#formats\"), site(\"Release notes\", \"#log\")]], [\"Support\", [nav(\"Contact support\", \"support\"), nav(\"User guide\", \"guide\"), site(\"FAQ\", \"#faq\")]], [\"Legal\", [nav(\"Privacy Policy\", \"privacy\"), nav(\"Terms of Use\", \"terms\"), nav(\"Open source\", \"oss\")]]],\n      head: {\n        support: { kicker: \"Support\", title: \"Contact support\", sub: \"Your message goes straight to the developer. Describe what happened as clearly as you can; most cases are resolved in a single reply.\", meta: \"Replies within 48 hours on business days · Chinese and English\" },\n        guide: { kicker: \"Support\", title: \"User guide\", sub: \"From first setup to moving to a new drive, in ten short chapters. No account and no internet connection required.\", meta: `For version ${version} · Updated with each release` },\n        privacy: { kicker: \"Legal\", title: \"Privacy Policy\", sub: \"The short version: your films stay on your device. We have no server to store them on.\", meta: `Updated ${updated} · Applies to Nsurator ${version} and later` },\n        terms: { kicker: \"Legal\", title: \"Terms of Use\", sub: \"Downloading and using Nsurator from the Mac App Store means you accept these terms. We have kept them short and readable.\", meta: `Updated ${updated} · Applies to Nsurator ${version} and later` },\n        oss: { kicker: \"Legal\", title: \"Open-Source Licenses\", sub: \"Nsurator is built on the following open-source projects. The list is checked item by item against what each version actually links, bundles or downloads, and updated with each release.\", meta: `For version ${version} · Full license texts ship with the app` },\n      },\n      routes: [\n        { n: \"1\", k: \"In the app\", rec: true, t: \"Report a Problem\", isText: true, tStyle: routeTitle, d: \"Version, system information and the recent diagnostic log are attached automatically; you only describe what happened, and add a screenshot if you have one. Reports go through Nsurator's own endpoint, not email.\", path: \"Settings › About › Report a Problem · During playback ⌘⌥D › Report this\" },\n        { n: \"2\", k: \"By email\", rec: false, t: \"support@nsurator.com\", href: \"mailto:support@nsurator.com\", isLink: true, tStyle: mailTitle, d: \"For suggestions, partnerships, or when the app will not open. Please state the type of issue in the subject line so it can be handled faster.\", path: \"Example subject: Issue: 4K HEVC frame drops (macOS 15.2 / M2)\" },\n      ],\n      before: [\n        { n: \"1\", t: \"System and version\", d: \"macOS version, Mac model and chip, Nsurator version.\", where: \"Settings › About · first line\" },\n        { n: \"2\", t: \"Steps to reproduce\", d: \"Brief steps, or a screen recording of about 15 seconds.\", where: \"⌘⇧5 to record · attach to the email\" },\n        { n: \"3\", t: \"Playback issues: diagnostic info\", d: \"Container, codecs, audio track, decoding path and the time the problem occurred — one click to copy from the diagnostics panel.\", where: \"During playback ⌘⌥D › Copy\" },\n      ],\n      lookups: [\n        { ...nav(\"First setup: four steps to get started\", \"guide\"), where: \"User guide\" },\n        { ...nav(\"Troubleshooting stutter, missing audio and 4K frame drops\", \"guide\"), where: \"User guide\" },\n        { ...nav(\"Whether files are ever uploaded\", \"privacy\"), where: \"Privacy\" },\n        { ...nav(\"Free-tier limits, Pro and refunds\", \"terms\"), where: \"Terms\" },\n      ],\n      guide: [\n        { title: \"Getting started\", blocks: [P(\"The first-launch setup walks through these four steps; this is the detailed version.\"), O([\n          [\"Choose where your films live\", \"The library location can be a local folder, an external drive or a mounted network share. Nsurator does not move your existing folder structure — it remembers paths and organizes by the rules you set. Unplugging an external drive loses nothing; metadata and tags stay.\", \"Settings › Organize › Library location\"],\n          [\"Hand your download folder to the Inbox\", \"Pick a folder to watch, usually Downloads. Once a download finishes, the file appears in the Inbox in one of three columns: To archive, Review, Not archivable.\", \"Settings › Organize › Watched folder\"],\n          [\"Archive the first batch\", \"In the To archive column, click Archive all. Files go into lists by person, year or series. Same-name files follow the rule you set; nothing is overwritten silently. Start with a few films to confirm the rules behave as expected.\", \"Inbox › Archive all\"],\n          [\"Double-click to play\", \"Our own playback core plays 30+ containers directly, from RMVB to HEVC and AV1; Blu-ray BDMV and ISO folders open as a single film; HEVC, AV1 and 4K go through hardware decoding. The free tier allows 15 plays per month; organizing, archiving, recognition and backup are unlimited.\", \"Any film › double-click / Space\"]])] },\n        { title: \"Inbox\", blocks: [P(\"The Inbox only watches the folders you specify and never touches other directories. New files appear only once the download has finished and the size is stable, so a half-downloaded file is never archived.\"), L([\"To archive: ready to process on this Mac; archive all with one click.\", \"Review: several candidate people or years were detected; pick one.\", \"Not archivable: the target drive is disconnected or the file is in use by another app. The reason is shown on each row; the file returns to To archive once the condition clears.\"]), P(\"Same-name files are not errors. Set the rule once under Same-name handling — skip, overwrite or add a number — and it is applied every time, with the affected files listed in the result.\")] },\n        { title: \"Lists and collections\", blocks: [P(\"Lists group by library; a film belongs to exactly one list, which mirrors its location on disk. Collections are a separate layer: a film can be in any number of collections without moving the file.\"), P(\"A smart collection is a rule that maintains itself. Combine person, year, resolution, tags, watched or unwatched and date added — for example, Unwatched · after 2024 · 4K. Change the rule and the collection updates immediately.\"), N(\"Changing drives or folder structures does not affect collections — they refer to the film itself, not its path.\")] },\n        { title: \"Playback and subtitles\", blocks: [P(\"Double-click or press Space to play. Audio and subtitle tracks switch from the lower-right corner of the player, and the last choice is remembered per film.\"), L([\"External subtitles: .srt, .ass and .sup files with the same name as the film are matched automatically; subtitles elsewhere in the same folder can be added under Companion files in the detail panel.\", \"Companion files travel with the film: archiving, moving or renaming carries subtitles and NFO files along.\", \"Resume: playback continues where you left off; reaching the end marks the film as watched.\"]), P(\"The free tier allows 15 plays per month, counted from the 1st; Pro is unlimited. The count is kept on this Mac only — we cannot see it.\")] },\n        { title: \"Playback diagnostics\", blocks: [P(\"Press ⌘⌥D during playback to open the diagnostics panel. It shows the container, codecs, audio track, current decoding path, dropped frames and read rate — check these first, and it is usually clear whether the file, the drive or the app is at fault.\"), K([[\"Dropped frames keep rising\", \"Usually the read rate cannot keep up: external drives, network shares and USB hubs are common causes. Copy the file to the internal disk and compare.\"], [\"No audio\", \"Check the audio codec: TrueHD and DTS-HD can only be transcoded on some Macs; try another audio track.\"], [\"Decoding shows software\", \"This codec combination is not hardware-decoded and 4K will load the CPU. HEVC 10-bit and AV1 should both show hardware on Apple silicon.\"], [\"Subtitles out of sync\", \"External subtitles can be offset as a whole in the player; embedded subtitles that drift should be reported.\"]]), P(\"Report this in the panel attaches that playback's diagnostics automatically; Copy places them on the clipboard for email.\")] },\n        { title: \"People\", blocks: [P(\"Recognition runs on your Mac: the model files are downloaded once when you first enable it, and after that frames and feature vectors never leave the device. The first pass over a film takes tens of seconds to a few minutes; after that it is incremental.\"), L([\"Reference photos: one or two front-facing photos make recognition more reliable; photos are stored only in the local library.\", \"Merge and rename: when one person appears as two, drag one onto the other to merge; renaming applies to all related films.\", \"Turn off recognition: once disabled in Settings, the app stops analyzing new films; deleting a person also deletes their feature vectors.\"])] },\n        { title: \"Private Space\", blocks: [P(\"Films moved into the Private Space disappear from lists, search, collections and the Spotlight index at the same time, and require Touch ID or your system password to see. No readable thumbnails are kept while locked.\"), L([\"Auto-lock: locks when you switch apps, the display sleeps or after a period of inactivity; choose the interval in Settings.\", \"Lock now: ⌘⌥L.\", \"Move out: after unlocking, right-click a film and choose Remove from Private Space; it returns to its original list.\"]), N(\"Unlock credentials are managed by the macOS Keychain and on-device biometrics; we do not hold them and cannot bypass them. There is therefore no recovery: if you lose access to this Mac, the contents of the Private Space cannot be restored. This is a deliberate design decision.\")] },\n        { title: \"AI agents\", blocks: [P(\"A Pro feature. When enabled, Nsurator runs an MCP server on the local loopback address; clients such as Claude Code, Codex, Cursor, Windsurf, Gemini and Kimi connect by pasting one line of configuration, and can then search the library, create collections and tag in bulk using natural language.\"), L([\"Per-permission switches: reading the library, writing tags, creating collections and moving files are independent; only Read is on by default.\", \"Call log: every call records its time, source and action, and can be viewed or cleared in Settings.\", \"Local only: the server accepts connections from this Mac only and is not exposed to the local network or the internet.\"]), N(\"The Private Space is always outside the reach of AI agents; no combination of permissions can read it.\")] },\n        { title: \"Backup and moving\", blocks: [P(\"Back up the library at any time from Backup & moving to a location you choose. Backups contain metadata only — tags, people, collections, watch history — not the video files, so they stay small.\"), O([\n          [\"Changing drives\", \"Copy the films to the new drive, then point Library location at it. Nsurator re-matches files by content, and tags and people follow.\", \"Settings › Organize › Library location\"],\n          [\"Replacing current data with a backup\", \"A rehearsal runs first and lists what will change; writing begins after you confirm. Merging is all-or-nothing: if any step fails, the whole run is rolled back and nothing is written.\", \"Settings › Backup & moving › Restore from backup\"]]),\n          P(\"If a few items cannot be written during a merge (for example a damaged record in the backup), Nsurator lists the items and the reasons and offers Skip these N items and continue; the rest merges as normal and the result lists what was left out. Causes such as a full disk or a locked library cannot be skipped and must be resolved before retrying.\")] },\n        { title: \"Keyboard shortcuts\", blocks: [K([[\"Space\", \"Play / pause\"], [\"← →\", \"Back / forward 10 seconds\"], [\"⌘1 ⌘2 ⌘3\", \"Films / Collections / Inbox\"], [\"⌘F\", \"Search the whole library\"], [\"⌘⇧A\", \"Archive everything in To archive\"], [\"⌘⌥D\", \"Open playback diagnostics\"], [\"⌘⌥L\", \"Lock the Private Space now\"], [\"⌘⌫\", \"Move selected films to the Trash\"]]), P(\"The full list is under Help › Keyboard Shortcuts in the menu bar.\")] },\n      ],\n      privacy: [\n        { title: \"In short\", blocks: [L([\"Your video files never leave your device; the app has no ability to upload them.\", \"There is no account and no sign-up, so nothing can be tied to you as a person.\", \"No analytics, no usage statistics, no third-party tracking SDKs.\", \"Only six kinds of network request, all listed in section 04, and each triggered by your own action.\"]), P(\"The full text follows. The summary is for convenience; where they differ, the full text applies.\")] },\n        { title: \"What this policy covers\", blocks: [P(\"This policy explains how Nsurator for macOS (the App) handles information about you. The App is distributed only through the Mac App Store; programs of the same name from other sources are unrelated to us.\"), P(\"The App has no account system. You do not register or sign in, and we therefore have no way to associate any data with you as a person.\")] },\n        { title: \"Data that stays on your device\", blocks: [P(\"All of the App's working data is written on your Mac — by default in the app sandbox's Application Support directory, with the library location chosen by you. This includes:\"), L([\"File paths, names, sizes, durations, containers and codecs of your films;\", \"Tags, notes, ratings, names of people and collection rules you create;\", \"Watch history and playback positions;\", \"Thumbnail and preview-frame caches;\", \"Face feature vectors, extracted from frames of your films by the on-device model to group appearances of the same person;\", \"The Private Space index, and local counters related to licensing such as this month's play count.\"]), P(\"We hold no copy of this data and have no server to store it on. You can copy or delete it in full at any time.\"), N(\"Video files themselves are never uploaded. The App has no capability to send video content to any remote destination.\")] },\n        { title: \"Every network request the App makes\", blocks: [P(\"The table below lists every case in which the App may connect to the internet. There is no background reporting, telemetry or heartbeat beyond these; offline, everything except the features below works normally.\"), T([\"Purpose\", \"Sent to\", \"Contents\"], [\n          [\"Purchase and license check\", \"Apple (App Store / StoreKit)\", \"Transaction receipts handled by Apple. We receive only a purchased / not purchased result — never your Apple ID, name or payment details.\"],\n          [\"Metadata lookup\", \"TMDB (themoviedb.org)\", \"Sent only when you click Fetch metadata; contains the title or year you are looking up. No file paths, device identifiers or account information.\"],\n          [\"Report a Problem\", \"Nsurator's own endpoint\", \"Only when you click Send: what you wrote, an optional reply email, the diagnostic log if selected, and any screenshots you added. The diagnostic log contains no file names, paths or people's names.\"],\n          [\"Crash and hang reports\", \"Apple\", \"Only if you have enabled Share with App Developers under System Settings › Privacy & Security › Analytics & Improvements. Anonymized by Apple; contains stack traces and device model, not file names.\"],\n          [\"Recognition model download\", \"The publishers' download locations (AuraFace: fal.ai; YuNet: OpenCV Zoo)\", \"Sent once, when you first enable people recognition; it is only a request to download the two model files and carries nothing about you or your films. Recognition then runs entirely on your Mac.\"],\n          [\"Access to media sources you add\", \"The SMB / SFTP / FTP / WebDAV servers or cloud drives (such as MEGA) you specify yourself\", \"Requests needed to read folders and video files, sent only to the server you entered or the service you signed in to; credentials stay on your Mac and never pass through us.\"]]), P(\"As with any network request, the recipient can see your IP address; the table does not repeat this per row. If you do not want online metadata lookup at all, simply do not use the feature; the App never starts a request on its own.\")] },\n        { title: \"People recognition happens on your Mac\", blocks: [P(\"Face detection and feature extraction run on on-device models — the model files are downloaded once, when you first enable recognition, and all computation then happens on your Mac. Photos, frames and feature vectors never leave the device and are not used to train any model.\"), P(\"Recognition can be turned off in Settings, after which the App stops analyzing new films. Deleting a person deletes their feature vectors.\")] },\n        { title: \"AI agents (MCP)\", blocks: [P(\"When enabled, the App listens on the local loopback address (127.0.0.1) and accepts connections only from clients on this Mac; it is not exposed to the local network or the internet. Each capability is granted separately, and every call is logged with time, source and action; the log can be viewed and cleared.\"), P(\"The Private Space is always excluded from what AI agents can see; no combination of permissions can read its contents.\"), N(\"The AI client you connect (for example Claude Code, Codex, Cursor, Windsurf, Gemini or Kimi) is a third-party product. What you type into it, and what it sends to which company's servers, is governed by that company's privacy policy. The App only answers the questions the client asks locally and cannot control what happens afterwards. Please read the client's privacy terms before connecting.\")] },\n        { title: \"Private Space\", blocks: [P(\"Films moved into the Private Space disappear from lists, search, collections and the Spotlight index at once, and require Touch ID or your system password to view. No readable thumbnail cache is kept while locked.\"), P(\"Unlock credentials are managed by the macOS Keychain and on-device biometrics; we do not hold them and cannot bypass them. There is therefore no recovery process: if you lose access to this Mac, we cannot help restore the contents. This is a deliberate design decision.\")] },\n        { title: \"What we do not do\", blocks: [L([\"We do not sell, rent or exchange any information about you;\", \"We show no advertising and build no user profiles or behavioral targeting;\", \"We include no third-party analytics or tracking SDKs — there is no Google Analytics, Firebase, Facebook SDK or third-party crash service in the App;\", \"We do not scan directories unrelated to the App in the background; we read only the library location and watched folders you have explicitly authorized.\"])] },\n        { title: \"Children\", blocks: [P(\"The App is not directed at children under 14 (13 or 16 in some regions) and does not knowingly collect their personal information. Because the App has no accounts and collects no identity information, it has no practical means of determining a user's age.\")] },\n        { title: \"Your rights and how to exercise them\", blocks: [P(\"Because the data is on your own device, you can exercise most rights directly, without waiting for us:\"), L([\"Access and export: the library is a folder plus a database file; copy it in full, or use Export in Settings.\", \"Correction: edit tags, people and notes directly in the app.\", \"Deletion: deleting the library folder removes all records; clearing the cache does not touch your video nts/Resources/Visuals/AgentIcons-ATTRIBUTION.md inside Nsurator.app.\")] },\n        { title: \"Playback core · in-process\", blocks: [P(\"NsuratorPlayerCore statically links the following FFmpeg build products, all unmodified; hardware decoding uses the system's VideoToolbox, which is not listed.\"), PK([[\"FFmpeg 8.1.2\", \"LGPL-2.1-or-later\", \"Container parsing, software-decoding fallback, subtitle decoding. Built under the LGPL configuration: no --enable-gpl or --enable-nonfree components.\"], [\"dav1d 1.5.3\", \"BSD-2-Clause\", \"AV1 software decoding.\"], [\"libbluray 1.4.1\", \"LGPL-2.1-or-later\", \"Blu-ray (BDMV) structure parsing.\"], [\"libudfread 1.2.0\", \"LGPL-2.1-or-later\", \"UDF file-system reading, used by libbluray.\"]])] },\n        { title: \"Playback and media · bundled command-line tools\", blocks: [P(\"The bundled ffmpeg / ffprobe are separate command-line programs, run as subprocesses for thumbnails, export, probing and transcoding. They statically link the following:\"), PK([[\"FFmpeg 8.1.2\", \"LGPL-2.1-or-later\", \"As above. No x264 / x265; H.264 encoding uses VideoToolbox.\"], [\"libass 0.17.5\", \"ISC\", \"ASS / SSA subtitle layout and rendering.\"], [\"FreeType 2.14.3\", \"FreeType License (FTL)\", \"Subtitle font rasterization. Portions of this software are copyright © The FreeType Project (www.freetype.org). All rights reserved.\"], [\"FriBidi 1.0.16\", \"LGPL-2.1-or-later\", \"Bidirectional text (Arabic, Hebrew and others).\"], [\"HarfBuzz 14.3.0\", \"MIT (Old MIT)\", \"Text shaping.\"], [\"libunibreak 7.0\", \"zlib\", \"Line-break opportunities for subtitles.\"], [\"libpng 1.6.58\", \"PNG Reference Library License\", \"PNG encoding for thumbnails.\"]])] },\n        { title: \"Library and data\", blocks: [PK([[\"SQLite\", \"Public Domain\", \"Library storage engine; uses the libsqlite3 that ships with macOS, not bundled separately.\"]])] },\n        { title: \"On-device recognition\", blocks: [P(\"Recognition runs on your Mac. The runtime ships with the app; the two model files are downloaded once, when you first enable recognition, and no network is used afterwards.\"), PK([[\"ONNX Runtime 1.23.2\", \"MIT\", \"Microsoft. Runs the face-detection and feature-extraction models on device.\"], [\"AuraFace-v1 (glintr100.onnx · af6d057)\", \"Apache-2.0\", \"fal.ai. Face feature-extraction model, downloaded on first use.\"], [\"YuNet (face_detection_yunet_2023mar.onnx)\", \"MIT\", \"OpenCV Zoo / Shiqi Yu. Face-detection model, downloaded on first use.\"]])] },\n        { title: \"Media sources and networking\", blocks: [P(\"Components used to connect to SMB shares, SFTP and MEGA. FTP, WebDAV and other cloud drives use the libcurl that ships with macOS, not bundled separately.\"), PK([[\"SMBClient 0.3.1\", \"MIT\", \"kishikawakatsumi. SMB share access.\"], [\"swift-nio 2.102.0 · swift-nio-ssh 0.15.0\", \"Apache-2.0\", \"Networking event loop and SSH / SFTP transport.\"], [\"swift-crypto 4.5.2\", \"Apache-2.0\", \"Cryptographic primitives; includes BoringSSL (ISC and OpenSSL licenses).\"], [\"swift-asn1 1.7.2 · swift-atomics 1.3.1 · swift-collections 1.6.0 · swift-system 1.8.1\", \"Apache-2.0\", \"Supporting dependencies of the Swift packages above.\"], [\"MEGA SDK 10.18.0\", \"BSD-2-Clause\", \"Mega Limited. MEGA cloud access.\"], [\"Statically linked into the MEGA SDK: Crypto++ · libsodium · libcurl · SQLite · ICU · zlib · zstd\", \"BSL-1.0 · ISC · curl · Public Domain · Unicode-ICU · zlib · BSD-3-Clause\", \"Versions pinned by vcpkg; used internally by the MEGA SDK only.\"]])] },\n        { title: \"AI agents\", blocks: [P(\"The MCP loopback service, NsuratorAgentProtocol, is our own implementation and uses no third-party MCP SDK or logging library; its networking relies on the swift-nio and swift-crypto packages above.\")] },\n        { title: \"Interface\", blocks: [P(\"Interface icons are Apple's SF Symbols (a system resource, not open source, not listed); the app bundles no third-party fonts.\"), PK([[\"Simple Icons\", \"CC0-1.0\", \"Only the six small client icons — Claude, Codex (OpenAI mark), Cursor, Windsurf, Gemini, Kimi — in the AI-agent settings.\"], [\"Lucide\", \"ISC\", \"One check-mark glyph in the first-launch setup, drawn on its 24-unit grid.\"]])] },\n        { title: \"Fonts used on this website (not app dependencies)\", blocks: [PK([[\"Figtree\", \"SIL OFL 1.1\", \"Website body typeface.\"], [\"Caprasimo\", \"SIL OFL 1.1\", \"Website heading typeface.\"]])] },\n        { title: \"Obtaining source for LGPL components\", blocks: [P(\"FFmpeg, libbluray, libudfread and FriBidi are used under the LGPL 2.1 or later, unmodified. The bundled ffmpeg / ffprobe are separate programs and can be replaced directly with your own builds of the same version; FFmpeg, libbluray and libudfread inside the in-process playback core are statically linked, and we provide the materials required for relinking under LGPL section 6.\"), P(\"For the exact sources, configure line and build scripts used in our build, and the object files needed for relinking, email support@nsurator.com with the app version number and we will provide the corresponding archive or public repository.\"), M(`$ ffmpeg -version            # the bundled command-line build\\nffmpeg version 8.1.2 … libavutil license: LGPL version 2.1 or later\\n\\n# Version and source archive\\n${version} · nsurator-${version}-oss.tar.gz`)] },\n        { title: \"What is not included\", blocks: [P(\"To avoid misunderstanding: the App contains no analytics or tracking SDKs, no advertising components, and no self-update framework outside the App Store — updates are distributed only through the Mac App Store. The playback components include no GPL encoders such as x264 / x265; H.264 encoding uses the system's VideoToolbox.\")] },\n        { title: \"Credits and corrections\", blocks: [P(\"If you maintain one of the projects above and find an attribution, license or description error, email support@nsurator.com and we will correct it in the next release.\")] },\n      ],\n      foot: { guide: [\"Anything not covered here? Write to us. The guide is updated with each release.\", \"support@nsurator.com\"], privacy: [\"If any clause is unclear, let us know and we will revise it.\", \"support@nsurator.com\"], terms: [\"Questions about any of these terms are welcome.\", \"support@nsurator.com\"], oss: [\"If the list is missing something or an attribution is wrong, let us know and we will correct it in the next release.\", \"support@nsurator.com\"] },\n    };\n\n    const C = en ? EN : ZH;\n    const railItem = (on) => `display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:999px;font-size:14px;line-height:1.4;transition:background .2s,color .2s;${on ? \"color:var(--color-text);font-weight:700;background:var(--color-neutral-200)\" : \"color:var(--color-neutral-700)\"}`;\n    const dot = (on) => `flex:none;width:6px;height:6px;border-radius:50%;background:${on ? \"#D9523F\" : \"transparent\"}`;\n    const groups = C.groups.map(([h, items]) => ({ h, items: items.map(([k, t]) => ({ ...nav(t, k), style: railItem(page === k), dot: dot(page === k) })) }));\n    const fcols = C.fcols.map(([h, links]) => ({ h, links }));\n    const SRC = { guide: C.guide, privacy: C.privacy, terms: C.terms, oss: C.oss }[page] || [];\n    const active = this.state.active;\n    const sections = SRC.map((s, i) => ({ id: `s${i + 1}`, n: String(i + 1).padStart(2, \"0\"), title: s.title, blocks: s.blocks }));\n    const toc = sections.map((s) => ({ n: s.n, title: s.title, href: `#${s.id}`,\n      style: `display:flex;gap:10px;align-items:baseline;padding:6px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;transition:background .2s,color .2s;${active === s.id ? \"color:var(--color-text);font-weight:700;background:var(--color-accent-2-100)\" : \"color:var(--color-neutral-600)\"}` }));\n    const foot = C.foot[page] || [\"\", \"\"];\n    const segOn = \"padding:6px 11px;border-radius:999px;background:#F9F4ED;color:#201e1d;font-size:12px;font-weight:700;line-height:1;cursor:pointer;transition:background .2s,color .2s\";\n    const segOff = \"padding:6px 11px;border-radius:999px;color:#C0B6A5;font-size:12px;font-weight:700;line-height:1;cursor:pointer;transition:background .2s,color .2s\";\n\n    return { lang, t: C.t, groups, fcols, head: C.head[page], routes: C.routes, before: C.before, diag, lookups: C.lookups, sections, toc,\n      hasToc: page !== \"support\", isSupport: page === \"support\", isDoc: page !== \"support\",\n      docFoot: foot[0], docMail: \"mailto:\" + foot[1], docMailText: foot[1],\n      setZh: () => this.setLang(\"zh\"), setEn: () => this.setLang(\"en\"), zhStyle: en ? segOff : segOn, enStyle: en ? segOn : segOff };\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>
