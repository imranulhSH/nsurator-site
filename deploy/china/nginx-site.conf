server {
    server_name www.nsurator.com.cn;

    root /var/www/nsurator-cn;
    index index.html;

    include /etc/nginx/snippets/nsurator-baidu-oauth-locations.conf;

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_types application/javascript text/javascript text/css image/svg+xml;
        gzip_vary on;
    }

    location / {
        try_files $uri $uri/ =404;
        gzip_vary on;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.nsurator.com.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.nsurator.com.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.nsurator.com.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.nsurator.com.cn;
    return 404; # managed by Certbot


}

# Canonical China website: preserve path and query while redirecting the apex.
server {
    listen 80;
    listen 443 ssl;
    server_name nsurator.com.cn;

    ssl_certificate /etc/letsencrypt/live/www.nsurator.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.nsurator.com.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.nsurator.com.cn$request_uri;
}
