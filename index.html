<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nsurator</title>
  <meta name="description" content="Nsurator support and privacy information.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1020;
      --panel: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --muted: #a8b3cf;
      --accent: #4f8cff;
      --border: rgba(255, 255, 255, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(79, 140, 255, 0.28), transparent 34rem), var(--bg);
    }
    main { max-width: 920px; margin: 0 auto; padding: 72px 24px; }
    .badge { color: var(--accent); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 12px; }
    h1 { font-size: clamp(42px, 8vw, 72px); line-height: 1; margin: 16px 0; }
    p { color: var(--muted); font-size: 18px; max-width: 680px; }
    .links { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
    a.button {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      background: var(--panel);
    }
    a.button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    footer { margin-top: 72px; color: var(--muted); font-size: 14px; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <div class="badge">macOS video library manager</div>
    <h1>Nsurator</h1>
    <p>Nsurator helps organize local video libraries with metadata, tags, actors, ratings, notes, search, and archive workflows.</p>
    <div class="links">
      <a class="button primary" href="./support.html">Support</a>
      <a class="button" href="./privacy.html">Privacy Policy</a>
    </div>
    <footer>Contact: <a href="mailto:852310683@qq.com">852310683@qq.com</a></footer>
  </main>
</body>
</html>
